[tools]
python = "latest"

[tasks.test]
run = "uv run -m pytest tests/"
description = "Run test suite"
alias = "t"

[tasks.refresh]
run = "mise run refresh::cdn && mise run refresh::documents && mise run refresh::vectors"
description = "Fast refresh: CDN data + rebuild documents + update vectorstore (skips slow wiki fetch)"
alias = "r"

[tasks."refresh::full"]
run = "mise run refresh::cdn && mise run refresh::wiki && mise run refresh::documents && mise run refresh::vectors"
description = "Full refresh: CDN + wiki data + rebuild documents + update vectorstore"

[tasks."refresh::cdn"]
run = "uv run python download_cdn.py"
description = "Download CDN data to data/cdn/"

[tasks."refresh::wiki"]
run = "uv run python download_wiki.py"
description = "Download wiki pages to data/wiki/ (slow)"

[tasks."refresh::documents"]
run = "uv run python main.py"
description = "Build data/documents.json from CDN + wiki data"

[tasks."refresh::vectors"]
run = "uv run -m vectorstore.build_index"
description = "Upsert documents into ChromaDB index"

[tasks.validate]
run = "uv run -m vectorstore.health_check && echo 'Index healthy' || (echo 'Rebuilding...' && uv run -m vectorstore.build_index)"
description = "Validate vectorstore health; rebuild if issues found"
alias = "v"

# --- Embedding server ---

# Debug commands (foreground mode)

[tasks.debug-embed-build]
run = "llama-server -hf jinaai/jina-embeddings-v5-text-small-retrieval-GGUF:Q8_0 --host 0.0.0.0 --port 8081 --embedding --pooling last -ngl 99 -np 1 -c 64000"
description = "Start embedding server in foreground — build mode (debug)"
alias = "deb"

[tasks.debug-embed]
run = "llama-server -hf jinaai/jina-embeddings-v5-text-small-retrieval-GGUF:Q8_0 --host 0.0.0.0 --port 8081 --embedding --pooling last -ngl 99 -np 4 -c 8192"
description = "Start embedding server in foreground — production (debug)"
alias = "dse"

# Background commands (with logging)

[tasks.start-embed-build]
run = '''
powershell -NoProfile -Command "New-Item -ItemType Directory -Force -Path logs | Out-Null; Start-Process -FilePath 'llama-server' -ArgumentList '-hf','jinaai/jina-embeddings-v5-text-small-retrieval-GGUF:Q8_0','--host','0.0.0.0','--port','8081','--embedding','--pooling','last','-ngl','99','-np','1','-c','64000' -WindowStyle Hidden -RedirectStandardOutput 'logs/embed-build.log' -RedirectStandardError 'logs/embed-build-error.log'; Write-Host 'Started embedding server build mode (:8081) - logs in logs/embed-build.log'"
'''
description = "Start embedding server — build mode (1 slot, 64k context) with logging"
alias = "eb"

[tasks.start-embed]
run = '''
powershell -NoProfile -Command "New-Item -ItemType Directory -Force -Path logs | Out-Null; Start-Process -FilePath 'llama-server' -ArgumentList '-hf','jinaai/jina-embeddings-v5-text-small-retrieval-GGUF:Q8_0','--host','0.0.0.0','--port','8081','--embedding','--pooling','last','-ngl','99','-np','4','-c','8192' -WindowStyle Hidden -RedirectStandardOutput 'logs/embed.log' -RedirectStandardError 'logs/embed-error.log'; Write-Host 'Started embedding server (:8081) - logs in logs/embed.log'"
'''
description = "Start embedding server — production (4 slots, 8k context) with logging"
alias = "se"

[tasks.stop-embed]
run = "powershell -NoProfile -Command \"$port = 8081; $process = Get-NetTCPConnection -LocalPort $port -ErrorAction SilentlyContinue | Select-Object -ExpandProperty OwningProcess -Unique; if ($process) { Stop-Process -Id $process -Force -ErrorAction SilentlyContinue; Write-Host ('Stopped embedding server (port ' + $port + ')') } else { Write-Host ('No process found on port ' + $port) }\""
description = "Stop embedding server (kills process on port 8081)"
alias = "xe"

# --- LLM server ---

# Debug commands (foreground mode)

[tasks.debug-llm]
run = "llama-server -hf unsloth/gemma-4-26B-A4B-it-qat-GGUF:UD-Q4_K_XL --spec-type draft-mtp --spec-draft-n-max 4 -ngl 999 -fa on -c 16384 --reasoning-budget 1024 -ctk q8_0 -ctv q8_0 --host 0.0.0.0 --port 8080"
description = "Start LLM server in foreground (debug)"
alias = "dsl"

# Background commands (with logging)

[tasks.start-llm]
run = '''
powershell -NoProfile -Command "New-Item -ItemType Directory -Force -Path logs | Out-Null; Start-Process -FilePath 'llama-server' -ArgumentList '-hf','unsloth/gemma-4-26B-A4B-it-qat-GGUF:UD-Q4_K_XL','--spec-type','draft-mtp','--spec-draft-n-max','4','-ngl','999','-fa','on','-c','16384','--reasoning-budget','1024','-ctk','q8_0','-ctv','q8_0','--host','0.0.0.0','--port','8080' -WindowStyle Hidden -RedirectStandardOutput 'logs/llm.log' -RedirectStandardError 'logs/llm-error.log'; Write-Host 'Started LLM server (:8080) - logs in logs/llm.log'"
'''
description = "Start LLM server (gemma-4-26B on :8080) with logging"
alias = "sl"

[tasks.stop-llm]
run = "powershell -NoProfile -Command \"$port = 8080; $process = Get-NetTCPConnection -LocalPort $port -ErrorAction SilentlyContinue | Select-Object -ExpandProperty OwningProcess -Unique; if ($process) { Stop-Process -Id $process -Force -ErrorAction SilentlyContinue; Write-Host ('Stopped LLM server (port ' + $port + ')') } else { Write-Host ('No process found on port ' + $port) }\""
description = "Stop LLM server (kills process on port 8080)"
alias = "xl"

# --- Open WebUI ---

# Debug commands (foreground mode)

[tasks.debug-webui]
run = "cd \"F:\\ProjectGorgon\\mywebui\" && uv run open-webui serve --port 3000"
description = "Start Open WebUI in foreground (debug)"
alias = "dsw"

# Background commands (with logging)

[tasks.start-webui]
run = '''
powershell -NoProfile -Command "New-Item -ItemType Directory -Force -Path logs | Out-Null; Start-Process -FilePath 'uv' -ArgumentList 'run','--directory','F:\\ProjectGorgon\\mywebui','open-webui','serve','--port','3000' -WindowStyle Hidden -RedirectStandardOutput 'logs/webui.log' -RedirectStandardError 'logs/webui-error.log'; Write-Host 'Started Open WebUI (:3000) - logs in logs/webui.log'"
'''
description = "Start Open WebUI on :3000 with logging"
alias = "sw"

[tasks.stop-webui]
run = "powershell -NoProfile -Command \"$port = 3000; $process = Get-NetTCPConnection -LocalPort $port -ErrorAction SilentlyContinue | Select-Object -ExpandProperty OwningProcess -Unique; if ($process) { Stop-Process -Id $process -Force -ErrorAction SilentlyContinue; Write-Host ('Stopped Open WebUI (port ' + $port + ')') } else { Write-Host ('No process found on port ' + $port) }"
description = "Stop Open WebUI (kills process on port 3000)"
alias = "xw"

# --- All services ---

[tasks.start-all]
run = '''
powershell -NoProfile -Command "New-Item -ItemType Directory -Force -Path logs | Out-Null; Start-Process -FilePath 'llama-server' -ArgumentList '-hf','jinaai/jina-embeddings-v5-text-small-retrieval-GGUF:Q8_0','--host','0.0.0.0','--port','8081','--embedding','--pooling','last','-ngl','99','-np','4','-c','8192' -WindowStyle Hidden -RedirectStandardOutput 'logs/embed.log' -RedirectStandardError 'logs/embed-error.log'; Start-Process -FilePath 'llama-server' -ArgumentList '-hf','unsloth/gemma-4-26B-A4B-it-qat-GGUF:UD-Q4_K_XL','--spec-type','draft-mtp','--spec-draft-n-max','4','-ngl','999','-fa','on','-c','16384','--reasoning-budget','1024','-ctk','q8_0','-ctv','q8_0','--host','0.0.0.0','--port','8080' -WindowStyle Hidden -RedirectStandardOutput 'logs/llm.log' -RedirectStandardError 'logs/llm-error.log'; Start-Process -FilePath 'uv' -ArgumentList 'run','--directory','F:\\ProjectGorgon\\mywebui','open-webui','serve','--port','3000' -WindowStyle Hidden -RedirectStandardOutput 'logs/webui.log' -RedirectStandardError 'logs/webui-error.log'; Write-Host 'Started: embed(:8081) llm(:8080) webui(:3000) - logs in logs/ directory'"
'''
description = "Start all services (embed + llm + webui) with logging"
alias = "start"

[tasks.stop-all]
run = '''
powershell -NoProfile -Command "Get-Process llama-server -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue; exit 0"
powershell -NoProfile -Command "$port = 3000; $process = Get-NetTCPConnection -LocalPort $port -ErrorAction SilentlyContinue | Select-Object -ExpandProperty OwningProcess -Unique; if ($process) { Stop-Process -Id $process -Force -ErrorAction SilentlyContinue; Write-Host ('Stopped Open WebUI (port ' + $port + ')') } else { Write-Host ('No process found on port ' + $port) }"
echo "All services stopped"
'''
description = "Stop all services"
alias = "down"

# --- Status check ---

[tasks.status]
run = "uv run python check_services.py"
description = "Check status of all services (embed, llm, webui)"
alias = "st"

# --- Log viewing ---

[tasks.logs]
run = "powershell -NoProfile -Command \"Get-ChildItem logs -ErrorAction SilentlyContinue | Select-Object Name, Length, LastWriteTime | Format-Table -AutoSize\""
description = "List all log files in logs directory"
alias = "logs"

[tasks.tail-embed]
run = "powershell -NoProfile -Command \"Get-Content logs/embed.log -ErrorAction SilentlyContinue -Wait -Tail 20\""
description = "Tail embedding server log (live, last 20 lines)"
alias = "tle"

[tasks.tail-llm]
run = "powershell -NoProfile -Command \"Get-Content logs/llm.log -ErrorAction SilentlyContinue -Wait -Tail 20\""
description = "Tail LLM server log (live, last 20 lines)"
alias = "tll"

[tasks.tail-webui]
run = "powershell -NoProfile -Command \"Get-Content logs/webui.log -ErrorAction SilentlyContinue -Wait -Tail 20\""
description = "Tail Open WebUI log (live, last 20 lines)"
alias = "tlw"
